default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: youthcamp_backend_development
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>

test:
  <<: *default
  database: youthcamp_backend_test
  host: localhost
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>

production:
  <<: *default
  host: <%= Rails.application.credentials.dig(:production, :postgres, :host) %>
  post: <%= Rails.application.credentials.dig(:production, :postgres, :post) %>
  database: <%= Rails.application.credentials.dig(:production, :postgres, :database) %>
  username: <%= Rails.application.credentials.dig(:production, :postgres, :username) %>
  password: <%= Rails.application.credentials.dig(:production, :postgres, :password) %>
  sslmode: <%= Rails.application.credentials.dig(:production, :postgres, :sslmode) %>
